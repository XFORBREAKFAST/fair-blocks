name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install
        run: npm install

      - name: Siapkan proyek Android
        run: |
          npx cap add android
          GITHUB_RUN_NUMBER=${{ github.run_number }} node scripts/patch-android.js
          npx cap sync android

      - name: Pakai kunci tanda tangan tetap (biar update tanpa uninstall)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FairBlocks-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan APK langsung (tanpa zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FairBlocks.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FairBlocks.apk --title "Fair Blocks build ${{ github.run_number }}" --notes "APK terbaru, install langsung menimpa versi lama." --latest
